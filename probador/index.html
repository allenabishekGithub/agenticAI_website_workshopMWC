<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP tester</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fuentes/mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fuentes/pixel.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/probador.css" />
    <script type="module" src="/probador.js"></script>
  </head>
  <body>
    <header>
      <span class="marca">mwc<span class="accent">/</span>workshop</span>
      <code id="endpoint" class="muted"></code>
    </header>

    <!-- Only in the Challenges: the server of the fix folder is in /solucion/mcp -->
    <nav id="pestanas" class="pestanas" aria-label="Code being executed" hidden>
      <a href="/">Your code</a>
      <a href="/solucion/">View solution</a>
    </nav>

    <main>
      <h1 id="servidor">MCP</h1>
      <p id="estado" class="muted" role="status">Connecting…</p>

      <section id="chat" aria-labelledby="titulo-chat">
        <div class="cabecera">
          <h2 id="titulo-chat">Chat <span id="modelo" class="muted"></span></h2>
          <button type="button" id="nueva">New conversation</button>
        </div>
        <p id="disponibles" class="muted"></p>
        <ol id="mensajes" aria-live="polite"></ol>
        <p id="pensando" class="muted" hidden>Thinking…</p>
        <form id="pregunta">
          <input name="texto" placeholder="Ask something…" aria-label="Your question" autocomplete="off" required />
          <button type="submit">Send ▸</button>
        </form>
      </section>

      <section aria-labelledby="titulo-herramientas">
        <h2 id="titulo-herramientas">Try tools</h2>
        <ul id="herramientas"></ul>
      </section>
    </main>
  </body>
</html>
