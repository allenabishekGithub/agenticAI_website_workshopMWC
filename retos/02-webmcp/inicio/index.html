<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Shop · MWC Workshop</title>
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <header class="cabecera">
      <a class="marca" href="/">The<span>/</span>store</a>
      <p id="agente" class="agente" hidden></p>
    </header>

    <main>
      <section class="catalogo" aria-label="Catalog">
        <form id="filtros" class="filtros">
          <label>
            <span>Search</span>
            <input type="search" name="texto" placeholder="keyboard, backpack…" autocomplete="off" />
          </label>
          <label>
            <span>Category</span>
            <select name="categoria">
              <option value="">All</option>
            </select>
          </label>
          <label>
            <span>Maximum price</span>
            <input type="number" name="precioMaximo" min="1" step="1" placeholder="€" />
          </label>
        </form>

        <!-- Section 3 · Jev -->
        <form id="inteligente" class="inteligente">
          <label>
            <span>Smart Search <small>· Jev</small></span>
            <input
              type="text"
              name="peticion"
              placeholder="a gift for someone who teleworks, for less than 60 €"
              autocomplete="off"
              required
            />
          </label>
          <button type="submit">Search</button>
        </form>

        <p id="estado" class="estado" role="status"></p>
        <ul id="productos" class="productos"></ul>
      </section>

      <aside class="carrito" aria-label="Cart">
        <h2>Cart</h2>
        <ul id="lineas"></ul>
        <p class="total"><span>Total</span><strong id="total">0 €</strong></p>
        <button id="vaciar" type="button">Empty cart</button>

        <!-- Block 2 · WebMCP (API declarative) -->
        <form id="ofertas" class="ofertas">
          <h2>Offers</h2>
          <label>
            <span>Email address</span>
            <input
              type="email"
              name="email"
              required
              placeholder="tu@coreo.com"
            />
          </label>
          <label>
            <span>Category you are interested in</span>
            <select name="categoria" required>
              <option>desk</option>
              <option>audio</option>
              <option>travel</option>
              <option>home</option>
            </select>
          </label>
          <button type="submit">Notify me</button>
          <p id="ofertas-estado" class="estado" role="status"></p>
        </form>
      </aside>
    </main>

    <dialog id="detalle" class="detalle" closedby="any">
      <form method="dialog"><button class="cerrar" aria-label="Close">×</button></form>
      <div id="detalle-contenido"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
